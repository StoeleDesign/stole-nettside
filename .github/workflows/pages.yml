# Bygger nettsiden og publiserer den på GitHub Pages (støle.com) ved hver endring på main.
name: Publiser nettsiden

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minst mulig rettigheter: lese koden, publisere til Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Bare én publisering om gangen; en ny endring avbryter ikke en som er i gang
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full historikk, så «sist endret» i sitemap blir riktig
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Finnes filen PAUSE, publiseres bare pausesiden i /pause (logoen). Slett PAUSE for å lansere nettsiden igjen.
      - name: Bygg nettsiden eller pausesiden
        run: |
          if [ -f PAUSE ]; then
            echo "Nettsiden er satt på pause, publiserer pausesiden"
            cp -r pause ut
          else
            node build.mjs
            cp -r dist ut
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ut

  publiser:
    needs: bygg
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
